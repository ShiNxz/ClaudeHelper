name: Release

# Push a tag like v0.4.0 to build the macOS DMG and the Windows installer and attach both to one GitHub Release.
# macOS signing and notarization run only when the Apple secrets below exist. Without them the app is ad-hoc signed.
#   MACOS_CERT_P12_BASE64        Developer ID Application certificate + private key, exported as .p12, base64 encoded
#   MACOS_CERT_PASSWORD          password of that .p12
#   MACOS_SIGNING_IDENTITY       e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                     Apple ID email used for notarization
#   APPLE_TEAM_ID                10-character team id
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that Apple ID
#
# Auto-update: each release carries latest-mac.json and latest.json, signed so the apps only install updates
# made with these keys (see the README). Without them the release has no update files.
#   RELAY_MAC_UPDATE_KEY         Ed25519 private key for macOS updates (scripts/sign-update.swift generate)
#   TAURI_SIGNING_PRIVATE_KEY    Tauri updater private key for Windows updates (tauri signer generate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password, if it has one
#
# Windows code signing through SignPath (free for open source), once the project is approved there:
#   secret SIGNPATH_API_TOKEN, variable SIGNPATH_ORGANIZATION_ID, and optionally the variables
#   SIGNPATH_PROJECT_SLUG (default relay) and SIGNPATH_SIGNING_POLICY_SLUG (default release-signing)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      RELAY_MAC_UPDATE_KEY: ${{ secrets.RELAY_MAC_UPDATE_KEY }}
    outputs:
      notarized: ${{ steps.notarize.outputs.done }}
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12_BASE64 != '' && env.MACOS_SIGNING_IDENTITY != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal app and DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./bundle.sh --universal --dmg

      - name: Self-test
        run: '"build/Relay.app/Contents/MacOS/Relay" --cli selftest'

      - name: Notarize and staple
        id: notarize
        if: env.SIGN_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != ''
        run: |
          DMG="$(ls build/Relay-*.dmg)"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "done=true" >> "$GITHUB_OUTPUT"

      # After notarizing: stapling changes the DMG, and the signature must cover the final file.
      - name: Sign the update
        if: env.RELAY_MAC_UPDATE_KEY != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SIG="$(swift scripts/sign-update.swift sign "build/Relay-$VERSION.dmg")"
          cat > build/latest-mac.json <<JSON
          {
            "version": "$VERSION",
            "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Relay-$VERSION.dmg",
            "signature": "$SIG",
            "notes": "Relay $VERSION"
          }
          JSON
          cat build/latest-mac.json

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/Relay-*.dmg
            build/latest-mac.json
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the core
        run: cargo test -p relay-core

      - name: Build the installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis --config "{\"version\":\"$VERSION\"}"
          mkdir -p ../build
          cp target/release/bundle/nsis/*-setup.exe "../build/Relay-$VERSION-windows-x64-setup.exe"
          ls -la ../build

      - name: Upload the unsigned installer for SignPath
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: build/Relay-*-windows-x64-setup.exe
          if-no-files-found: error

      - name: Code sign with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'relay' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed

      - name: Use the signed installer
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          cp ../build/signed/Relay-*-windows-x64-setup.exe ../build/
          rm -rf ../build/signed

      # Last, so the update signature covers the installer exactly as published (code signing changes it).
      - name: Sign the update
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="Relay-$VERSION-windows-x64-setup.exe"
          npx --yes @tauri-apps/cli@2.12.4 signer sign "../build/$FILE"
          VERSION="$VERSION" FILE="$FILE" node -e '
            const fs = require("fs");
            const { VERSION, FILE, GITHUB_REPOSITORY, GITHUB_REF_NAME } = process.env;
            const signature = fs.readFileSync("../build/" + FILE + ".sig", "utf8").trim();
            const url = "https://github.com/" + GITHUB_REPOSITORY + "/releases/download/" + GITHUB_REF_NAME + "/" + FILE;
            const latest = { version: VERSION, notes: "Relay " + VERSION, pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature, url } } };
            fs.writeFileSync("../build/latest.json", JSON.stringify(latest, null, 2) + "\n");
          '
          rm "../build/$FILE.sig"
          cat ../build/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/Relay-*-windows-x64-setup.exe
            build/latest.json
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum Relay-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZED: ${{ needs.macos.outputs.notarized }}
          SIGNED_WINDOWS: ${{ secrets.SIGNPATH_API_TOKEN != '' && 'yes' || '' }}
        run: |
          NOTE="Unofficial tool, not affiliated with Anthropic. Download the .dmg for macOS or the -setup.exe for Windows."
          if [ "$NOTARIZED" != "true" ]; then
            NOTE="$NOTE The macOS build is not notarized: the first time, open it from System Settings > Privacy & Security > Open Anyway."
          fi
          if [ -z "$SIGNED_WINDOWS" ]; then
            NOTE="$NOTE The Windows installer is not code signed, so SmartScreen may warn: click More info > Run anyway."
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Relay $GITHUB_REF_NAME" --notes "$NOTE" --generate-notes
