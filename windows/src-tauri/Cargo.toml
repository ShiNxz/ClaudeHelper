[package]
name = "relay"
version = "0.4.0"
edition = "2021"
description = "Relay: use several Claude accounts on one computer"
license = "MIT"
publish = false

[lib]
name = "relay_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
relay-core = { version = "0.4.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1.29.1", features = ["v4"] }

[build-dependencies]
tauri-build = "2"
